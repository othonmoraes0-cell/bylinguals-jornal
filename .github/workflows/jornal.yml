name: Jornal do Club (The Bylinguals Daily)

# 9 temas, um robô por tema, em paralelo (cada um ~1h): 3 notícias dos EUA, 3 do mundo e 3 do Brasil por tema.
# Modelo aberto (Qwen2.5 14B) no processador do GitHub, grátis. Fontes: só título e resumo dos feeds; NASA inteira.
# Notícia completa só com 3+ veículos (ou NASA); o resto vira nota curta de um veículo; toda frase passa por conferência.
# Repositório só do jornal (09/10/2026): se o GitHub um dia limitar o jornal pelo volume, o robô das legendas continua.
# O robô de cada tema para logo no começo se o tema já chegou ao Portal hoje.
on:
  schedule:
    - cron: "17 6 * * *" # 3h17 em São Paulo
  workflow_dispatch:
    inputs:
      forcar:
        description: "Escrever mesmo que o tema de hoje já exista (as notícias sem respostas são trocadas)"
        type: boolean
        default: false
      seco:
        description: "Só testar: escreve e mostra no resumo, sem entregar ao Portal"
        type: boolean
        default: false
      so_feeds:
        description: "Só conferir os feeds (sem IA, uns 2 minutos)"
        type: boolean
        default: false
      temas:
        description: "Quais temas (separados por vírgula). Vazio = todos"
        required: false
        default: ""
      dia:
        description: "Dia da edição (AAAA-MM-DD). Vazio = hoje"
        required: false
        default: ""

permissions:
  id-token: write # token OIDC: é assim que o Portal sabe que é este robô (sem senha)
  contents: write # só nos testes: grava o resultado no ramo "testes" para a equipe ler

jobs:
  feeds:
    if: inputs.so_feeds == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q trafilatura==1.12.2 requests==2.32.3
      - name: Conferir os feeds
        env:
          SO_FEEDS: "true"
        run: |
          # O script importa o tradutor só quando traduz: aqui não precisa.
          python robo/jornal.py
      - name: Guardar no ramo testes
        if: always()
        run: |
          git config user.name "robo-bylinguals" && git config user.email "robo@users.noreply.github.com"
          if git fetch -q origin testes; then git worktree add -q ramo FETCH_HEAD; else git worktree add -q --detach ramo && (cd ramo && git checkout -q --orphan testes && git rm -rqf . 2>/dev/null || true); fi
          mkdir -p ramo/feeds && cp saida/feeds.md ramo/feeds/feeds.md 2>/dev/null || echo "sem resultado" > ramo/feeds/feeds.md
          cd ramo && git add -A && git commit -qm "Feeds do Jornal" && git push -q origin HEAD:testes

  temas:
    if: inputs.so_feeds != true
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        tema: [politics, economy, business, science, health, sports, culture, space, entertainment]
    concurrency:
      group: jornal-${{ matrix.tema }}
      cancel-in-progress: false
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.bylinguals.com.br' }}
      FORCAR: ${{ inputs.forcar || 'false' }}
      SECO: ${{ inputs.seco || 'false' }}
      DIA: ${{ inputs.dia }}
      TEMA: ${{ matrix.tema }}
      MODELO_ROTULO: qwen2.5-14b
    steps:
      - name: Este tema hoje?
        id: escolha
        run: |
          T="${{ inputs.temas }}"
          if [ -z "$T" ] || echo ",$T," | tr -d ' ' | grep -q ",$TEMA,"; then echo "fazer=sim" >> "$GITHUB_OUTPUT"; else echo "fazer=nao" >> "$GITHUB_OUTPUT"; fi

      # Antes de instalar tudo (uns 8 minutos): o tema de hoje já chegou ao Portal? Então para aqui.
      - name: Já chegou ao Portal?
        id: portal
        if: steps.escolha.outputs.fazer == 'sim'
        run: |
          if [ "$FORCAR" = "true" ] || [ "$SECO" = "true" ]; then echo "fazer=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$TEMA" in
            politics) NOME="Politics & Elections" ;; economy) NOME="Economy & Personal Finance" ;; business) NOME="Business" ;;
            science) NOME="Science" ;; health) NOME="Health" ;; sports) NOME="Sports" ;; culture) NOME="Culture" ;;
            space) NOME="Space & Earth" ;; entertainment) NOME="Entertainment & Curiosities" ;;
          esac
          DIA_Q=${DIA:-$(TZ=America/Sao_Paulo date +%F)}
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bylinguals-portal" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          Q=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$NOME")
          STATUS=$(curl -sS -o hoje.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$SITE_URL/api/robo/jornal?dia=$DIA_Q&tema=$Q") || STATUS=000
          echo "HTTP $STATUS $(cat hoje.json 2>/dev/null)"
          if [ "$STATUS" = "200" ] && grep -q '"existe":true' hoje.json; then echo "::notice title=Jornal::$NOME já está no Portal hoje"; echo "fazer=nao" >> "$GITHUB_OUTPUT"; else echo "fazer=sim" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.escolha.outputs.fazer == 'sim' && steps.portal.outputs.fazer == 'sim'

      - uses: actions/setup-python@v5
        if: steps.escolha.outputs.fazer == 'sim' && steps.portal.outputs.fazer == 'sim'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: robo/requirements*.txt

      - name: Ferramentas
        if: steps.escolha.outputs.fazer == 'sim' && steps.portal.outputs.fazer == 'sim'
        run: |
          pip install -q trafilatura==1.12.2 requests==2.32.3
          pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r robo/requirements-traducao.txt

      - name: llama.cpp (compilado aqui, só o servidor)
        if: steps.escolha.outputs.fazer == 'sim' && steps.portal.outputs.fazer == 'sim'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llama
          cmake -S llama -B llama/build -DLLAMA_CURL=OFF -DGGML_NATIVE=ON -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build llama/build --target llama-server -j "$(nproc)" > /dev/null

      - name: Baixar o modelo
        if: steps.escolha.outputs.fazer == 'sim' && steps.portal.outputs.fazer == 'sim'
        run: curl -sSL --retry 3 -o modelo.gguf "https://huggingface.co/bartowski/Qwen2.5-14B-Instruct-GGUF/resolve/main/Qwen2.5-14B-Instruct-Q4_K_M.gguf" && ls -lh modelo.gguf

      - name: Escrever o tema
        if: steps.escolha.outputs.fazer == 'sim' && steps.portal.outputs.fazer == 'sim'
        run: |
          llama/build/bin/llama-server -m modelo.gguf -c 8192 -t $(nproc) --port 8080 > servidor.log 2>&1 &
          for i in $(seq 1 150); do curl -s localhost:8080/health | grep -q ok && break; sleep 2; done
          python robo/jornal.py

      - name: Registro do servidor
        if: failure()
        run: tail -n 40 servidor.log || true

      - name: Teste seco → ramo testes
        if: always() && env.SECO == 'true' && steps.escolha.outputs.fazer == 'sim'
        run: |
          git config user.name "robo-bylinguals" && git config user.email "robo@users.noreply.github.com"
          for tentativa in 1 2 3 4 5; do
            rm -rf ramo; git worktree prune
            if git fetch -q origin testes; then git worktree add -q ramo FETCH_HEAD; else git worktree add -q --detach ramo && (cd ramo && git checkout -q --orphan testes && git rm -rqf . 2>/dev/null || true); fi
            mkdir -p ramo/seco && cp saida/edicao.md "ramo/seco/$TEMA.md" 2>/dev/null || echo "sem resultado" > "ramo/seco/$TEMA.md"
            (cd ramo && git add -A && git commit -qm "Teste seco: $TEMA" && git push -q origin HEAD:testes) && break
            sleep $((tentativa * 9))
          done
